<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 정적 자산은 FastAPI가 /static 으로 서빙하므로 상대경로 기준점을 고정 (API fetch는 절대경로라 영향 없음) -->
  <base href="/static/" />
  <title>회의록 브레인 · Meeting Brain</title>

  <!-- Cal.com 디자인 시스템 토큰/폰트 -->
  <link rel="stylesheet" href="ds/styles.css" />
  <!-- 앱 테마 (다크 표면 + Pretendard) — DS 뒤에 로드해 토큰 재매핑 -->
  <link rel="stylesheet" href="app/theme.css" />

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#0e0e11" />
      <g transform="translate(30,28)" fill="none" stroke="#5b8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 0 38 10 20 20 2 10 20 0Z" />
        <path d="M2 20 20 30 38 20" />
        <path d="M2 32 20 42 38 32" />
      </g>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Cal.com 컴포넌트 번들 (React 전역 필요) -->
  <script src="ds/bundle.js"></script>

  <!-- 데이터 & AI (바닐라) -->
  <script src="app/data.js"></script>
  <script src="app/ai.js"></script>

  <!-- 앱 컴포넌트 & 화면 (Babel) -->
  <script type="text/babel" src="app/components.jsx"></script>
  <script type="text/babel" src="app/screen_input.jsx"></script>
  <script type="text/babel" src="app/screen_search.jsx"></script>
  <script type="text/babel" src="app/screen_board.jsx"></script>
  <script type="text/babel" src="app/screen_dashboard.jsx"></script>
  <script type="text/babel" src="app/App.jsx"></script>

  <!-- 마운트 -->
  <script type="text/babel" data-presets="react">
    const mount = () => {
      if (!window.App) { setTimeout(mount, 30); return; }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    };
    mount();
  </script>
</body>
</html>
